name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build plugin zip
        run: |
          git archive --format=zip --prefix=feedland-rivers/ HEAD \
            -o "feedland-rivers-${VERSION}.zip" \
            -- . ':!composer.json' ':!composer.lock' ':!.phpcs.xml.dist' ':!README.md' ':!.gitignore' ':!.github' ':!CLAUDE.md' ':!docker-compose.yml'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: feedland-rivers-${{ env.VERSION }}.zip
          body: |
            Download `feedland-rivers-${{ env.VERSION }}.zip` below — this is the installable plugin package.

            The "Source code (zip)" and "Source code (tar.gz)" are GitHub's raw repo checkout and include dev-only files not needed to run the plugin.
